<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        header {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .status {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 12px;
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .status-dot.online {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .status-dot.offline {
            background: #ef4444;
        }

        .content {
            padding: 28px;
        }

        .form-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 22px;
            border: 1px solid #e2e8f0;
        }

        .form-section h2 {
            font-size: 17px;
            color: #1e293b;
            margin-bottom: 14px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input[type="text"],
        input[type="number"] {
            flex: 1;
            min-width: 140px;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add {
            background: #4f46e5;
            color: white;
        }

        .btn-add:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .btn-update {
            background: #059669;
            color: white;
            display: none;
        }

        .btn-update:hover {
            background: #047857;
        }

        .btn-cancel {
            background: #94a3b8;
            color: white;
            display: none;
        }

        .search-box {
            margin-bottom: 22px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        td {
            padding: 14px 16px;
            border-top: 1px solid #e2e8f0;
            color: #1e293b;
        }

        tr:hover {
            background: #f8fafc;
        }

        .price {
            font-weight: 700;
            color: #059669;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 16px;
        }

        .stats {
            margin-top: 18px;
            text-align: right;
            color: #64748b;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 9999;
            transform: translateX(120%);
            transition: 0.3s;
            max-width: 280px;
        }

        .toast.show {
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
            .status {
                position: static;
                justify-content: center;
                margin-top: 10px;
            }
        }
    </style>

    <!-- Firebase SDK (cùng version với file game của bạn) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Quản lý sản phẩm Online</h1>
            <p>Dữ liệu lưu trên server · Nhiều người cùng xem & chỉnh</p>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Đang kết nối...</span>
            </div>
        </header>

        <div class="content">
            <!-- Form thêm / sửa -->
            <div class="form-section">
                <h2 id="formTitle">➕ Thêm sản phẩm mới</h2>
                <div class="form-row">
                    <input type="text" id="productName" placeholder="Tên sản phẩm (ví dụ: Nước ngọt Coca)">
                    <input type="number" id="productPrice" placeholder="Giá bán (VNĐ)" min="0">
                    <button class="btn-add" id="btnAdd" onclick="addProduct()">Thêm sản phẩm</button>
                    <button class="btn-update" id="btnUpdate" onclick="updateProduct()">Cập nhật</button>
                    <button class="btn-cancel" id="btnCancel" onclick="cancelEdit()">Hủy</button>
                </div>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm theo tên..." oninput="searchProducts()">
            </div>

            <!-- Bảng danh sách -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px">STT</th>
                            <th>Tên sản phẩm</th>
                            <th>Giá bán</th>
                            <th style="width: 150px">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="productTable">
                        <tr>
                            <td colspan="4" class="loading">⏳ Đang tải dữ liệu từ server...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="stats" id="stats">Tổng số sản phẩm: 0</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ======================================================
        // FIREBASE CONFIG (lấy từ file game của bạn)
        // ======================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCyapf8zLqz31Jc7gMUweXrZk1ReP07dv0",
            databaseURL: "https://nhantin-4ee06-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nhantin-4ee06"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ======================================================
        // STATE
        // ======================================================
        let products = {};          // { id: { name, price, createdAt } }
        let editId = null;          // id đang sửa
        let isReady = false;

        // ======================================================
        // KẾT NỐI REALTIME
        // ======================================================
        const productsRef = db.ref('cua_hang_san_pham');

        productsRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            products = data;
            isReady = true;
            setOnline(true);
            renderProducts();
        }, (error) => {
            console.error('Lỗi Firebase:', error);
            setOnline(false);
            toast('Không kết nối được server. Kiểm tra mạng!');
        });

        // ======================================================
        // UI HELPERS
        // ======================================================
        function setOnline(online) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (online) {
                dot.className = 'status-dot online';
                text.textContent = 'Đã kết nối';
            } else {
                dot.className = 'status-dot offline';
                text.textContent = 'Mất kết nối';
            }
        }

        function toast(msg, duration = 2500) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), duration);
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN').format(price) + ' đ';
        }

        // ======================================================
        // RENDER
        // ======================================================
        function getProductList() {
            return Object.keys(products).map(id => ({
                id,
                ...products[id]
            })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        }

        function renderProducts(list) {
            if (!list) list = getProductList();

            const tbody = document.getElementById('productTable');
            tbody.innerHTML = '';

            if (!isReady) {
                tbody.innerHTML = `<tr><td colspan="4" class="loading">⏳ Đang tải dữ liệu từ server...</td></tr>`;
                return;
            }

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty">Chưa có sản phẩm nào. Hãy thêm sản phẩm đầu tiên!</td></tr>`;
            } else {
                list.forEach((product, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${escapeHtml(product.name)}</td>
                        <td class="price">${formatPrice(product.price)}</td>
                        <td class="actions">
                            <button class="btn-edit" onclick="editProduct('${product.id}')">Sửa</button>
                            <button class="btn-delete" onclick="deleteProduct('${product.id}')">Xóa</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            document.getElementById('stats').textContent = `Tổng số sản phẩm: ${getProductList().length}`;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ======================================================
        // CRUD
        // ======================================================
        function addProduct() {
            if (!isReady) {
                toast('Chưa kết nối server, vui lòng đợi...');
                return;
            }

            const name = document.getElementById('productName').value.trim();
            const price = document.getElementById('productPrice').value;

            if (!name) {
                toast('Vui lòng nhập tên sản phẩm!');
                return;
            }
            if (!price || price < 0) {
                toast('Vui lòng nhập giá hợp lệ!');
                return;
            }

            const newRef = productsRef.push();
            newRef.set({
                name: name,
                price: Number(price),
                createdAt: Date.now()
            }).then(() => {
                toast('✅ Đã thêm sản phẩm!');
                clearForm();
            }).catch(err => {
                console.error(err);
                toast('Lỗi khi thêm sản phẩm');
            });
        }

        function editProduct(id) {
            const product = products[id];
            if (!product) return;

            editId = id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productPrice').value = product.price;

            document.getElementById('formTitle').textContent = '✏️ Sửa sản phẩm';
            document.getElementById('btnAdd').style.display = 'none';
            document.getElementById('btnUpdate').style.display = 'inline-block';
            document.getElementById('btnCancel').style.display = 'inline-block';
        }

        function updateProduct() {
            if (!editId) return;

            const name = document.getElementById('productName').value.trim();
            const price = document.getElementById('productPrice').value;

            if (!name || !price || price < 0) {
                toast('Vui lòng nhập đầy đủ thông tin hợp lệ!');
                return;
            }

            productsRef.child(editId).update({
                name: name,
                price: Number(price)
            }).then(() => {
                toast('✅ Đã cập nhật sản phẩm!');
                cancelEdit();
            }).catch(err => {
                console.error(err);
                toast('Lỗi khi cập nhật');
            });
        }

        function cancelEdit() {
            editId = null;
            clearForm();
            document.getElementById('formTitle').textContent = '➕ Thêm sản phẩm mới';
            document.getElementById('btnAdd').style.display = 'inline-block';
            document.getElementById('btnUpdate').style.display = 'none';
            document.getElementById('btnCancel').style.display = 'none';
        }

        function deleteProduct(id) {
            const product = products[id];
            if (!product) return;

            if (!confirm(`Bạn có chắc muốn xóa "${product.name}" không?`)) return;

            productsRef.child(id).remove()
                .then(() => toast('🗑️ Đã xóa sản phẩm'))
                .catch(err => {
                    console.error(err);
                    toast('Lỗi khi xóa');
                });
        }

        // ======================================================
        // TÌM KIẾM
        // ======================================================
        function searchProducts() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const list = getProductList();

            if (!keyword) {
                renderProducts(list);
                return;
            }

            const filtered = list.filter(p =>
                p.name.toLowerCase().includes(keyword)
            );
            renderProducts(filtered);
        }

        // ======================================================
        // FORM HELPERS
        // ======================================================
        function clearForm() {
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productName').focus();
        }

        // Enter để thêm / cập nhật
        document.getElementById('productName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('productPrice').focus();
        });
        document.getElementById('productPrice').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (editId) updateProduct();
                else addProduct();
            }
        });
    </script>
</body>
</html>
