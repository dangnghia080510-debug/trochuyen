<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Cửa hàng nhà tôi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        header {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.9;
            font-size: 15px;
        }

        .content {
            padding: 30px;
        }

        /* Form thêm sản phẩm */
        .form-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        .form-section h2 {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input[type="text"],
        input[type="number"] {
            flex: 1;
            min-width: 150px;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add {
            background: #4f46e5;
            color: white;
        }

        .btn-add:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .btn-update {
            background: #059669;
            color: white;
            display: none;
        }

        .btn-update:hover {
            background: #047857;
        }

        .btn-cancel {
            background: #94a3b8;
            color: white;
            display: none;
        }

        /* Thanh tìm kiếm */
        .search-box {
            margin-bottom: 25px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
        }

        /* Bảng sản phẩm */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        td {
            padding: 14px 16px;
            border-top: 1px solid #e2e8f0;
            color: #1e293b;
        }

        tr:hover {
            background: #f8fafc;
        }

        .price {
            font-weight: 700;
            color: #059669;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 16px;
        }

        .stats {
            margin-top: 20px;
            text-align: right;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Quản lý sản phẩm</h1>
            <p>Nhập tên & giá → Tìm kiếm nhanh khi bán hàng</p>
        </header>

        <div class="content">
            <!-- Form thêm / sửa -->
            <div class="form-section">
                <h2 id="formTitle">➕ Thêm sản phẩm mới</h2>
                <div class="form-row">
                    <input type="text" id="productName" placeholder="Tên sản phẩm (ví dụ: Nước ngọt Coca)">
                    <input type="number" id="productPrice" placeholder="Giá bán (VNĐ)" min="0">
                    <button class="btn-add" id="btnAdd" onclick="addProduct()">Thêm sản phẩm</button>
                    <button class="btn-update" id="btnUpdate" onclick="updateProduct()">Cập nhật</button>
                    <button class="btn-cancel" id="btnCancel" onclick="cancelEdit()">Hủy</button>
                </div>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm theo tên..." oninput="searchProducts()">
            </div>

            <!-- Bảng danh sách -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px">STT</th>
                            <th>Tên sản phẩm</th>
                            <th>Giá bán</th>
                            <th style="width: 150px">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="productTable">
                        <!-- Dữ liệu sẽ được thêm bằng JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="stats" id="stats">Tổng số sản phẩm: 0</div>
        </div>
    </div>

    <script>
        // Lấy dữ liệu từ localStorage
        let products = JSON.parse(localStorage.getItem('products')) || [];
        let editIndex = -1; // -1 nghĩa là đang ở chế độ thêm mới

        // Hiển thị danh sách sản phẩm
        function renderProducts(list = products) {
            const tbody = document.getElementById('productTable');
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty">Chưa có sản phẩm nào. Hãy thêm sản phẩm đầu tiên!</td></tr>`;
            } else {
                list.forEach((product, index) => {
                    // Tìm index thật trong mảng gốc (khi đang search)
                    const realIndex = products.findIndex(p => p.id === product.id);
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${product.name}</td>
                        <td class="price">${formatPrice(product.price)}</td>
                        <td class="actions">
                            <button class="btn-edit" onclick="editProduct(${realIndex})">Sửa</button>
                            <button class="btn-delete" onclick="deleteProduct(${realIndex})">Xóa</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            document.getElementById('stats').textContent = `Tổng số sản phẩm: ${products.length}`;
        }

        // Định dạng giá tiền
        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN').format(price) + ' đ';
        }

        // Thêm sản phẩm
        function addProduct() {
            const name = document.getElementById('productName').value.trim();
            const price = document.getElementById('productPrice').value;

            if (!name) {
                alert('Vui lòng nhập tên sản phẩm!');
                return;
            }
            if (!price || price < 0) {
                alert('Vui lòng nhập giá hợp lệ!');
                return;
            }

            products.push({
                id: Date.now(), // id duy nhất
                name: name,
                price: Number(price)
            });

            saveAndRender();
            clearForm();
        }

        // Sửa sản phẩm
        function editProduct(index) {
            editIndex = index;
            const product = products[index];

            document.getElementById('productName').value = product.name;
            document.getElementById('productPrice').value = product.price;

            document.getElementById('formTitle').textContent = '✏️ Sửa sản phẩm';
            document.getElementById('btnAdd').style.display = 'none';
            document.getElementById('btnUpdate').style.display = 'inline-block';
            document.getElementById('btnCancel').style.display = 'inline-block';
        }

        // Cập nhật sản phẩm
        function updateProduct() {
            const name = document.getElementById('productName').value.trim();
            const price = document.getElementById('productPrice').value;

            if (!name || !price || price < 0) {
                alert('Vui lòng nhập đầy đủ thông tin hợp lệ!');
                return;
            }

            products[editIndex].name = name;
            products[editIndex].price = Number(price);

            saveAndRender();
            cancelEdit();
        }

        // Hủy sửa
        function cancelEdit() {
            editIndex = -1;
            clearForm();
            document.getElementById('formTitle').textContent = '➕ Thêm sản phẩm mới';
            document.getElementById('btnAdd').style.display = 'inline-block';
            document.getElementById('btnUpdate').style.display = 'none';
            document.getElementById('btnCancel').style.display = 'none';
        }

        // Xóa sản phẩm
        function deleteProduct(index) {
            if (confirm(`Bạn có chắc muốn xóa "${products[index].name}" không?`)) {
                products.splice(index, 1);
                saveAndRender();
            }
        }

        // Tìm kiếm
        function searchProducts() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!keyword) {
                renderProducts();
                return;
            }

            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(keyword)
            );
            renderProducts(filtered);
        }

        // Lưu vào localStorage và render lại
        function saveAndRender() {
            localStorage.setItem('products', JSON.stringify(products));
            renderProducts();
            // Giữ nguyên từ khóa tìm kiếm nếu đang search
            const keyword = document.getElementById('searchInput').value;
            if (keyword) searchProducts();
        }

        // Xóa form
        function clearForm() {
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productName').focus();
        }

        // Cho phép nhấn Enter để thêm
        document.getElementById('productName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('productPrice').focus();
        });
        document.getElementById('productPrice').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (editIndex === -1) addProduct();
                else updateProduct();
            }
        });

        // Hiển thị khi mở trang
        renderProducts();
    </script>
</body>
</html>
